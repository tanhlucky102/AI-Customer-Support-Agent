# docker compose up --build      then, once:  docker compose run --rm agent python scripts/setup_demo.py
# Secrets come from .env (see .env.example). The browser reaches every service on localhost.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: support_agent
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ati -d support_agent"]
      interval: 3s
      retries: 20

  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ati:${POSTGRES_PASSWORD:-change_me}@db:5432/support_agent
      DEMO_SHOP_API_URL: http://shop:8001
      SECOND_SHOP_API_URL: http://second-shop:8003
      AGENT_SERVER_URL: http://localhost:8000
    ports: ["8000:8000"]
    volumes: [models:/models]
    depends_on:
      db: {condition: service_healthy}

  shop:
    build: .
    working_dir: /app/shop_demo
    command: sh -c "python seed.py && uvicorn app:app --host 0.0.0.0 --port 8001"
    env_file: .env
    environment:
      AGENT_SERVER_URL: http://localhost:8000
    ports: ["8001:8001"]

  second-shop:
    build: .
    command: uvicorn examples.second_shop.app:app --host 0.0.0.0 --port 8003
    env_file: .env
    environment:
      AGENT_SERVER_URL: http://localhost:8000
    ports: ["8003:8003"]

volumes:
  pgdata:
  models:
